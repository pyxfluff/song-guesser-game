[project]
name = "songguesser"
version = "0.1.0"
description = "Guess songs from short durations using navidrome"
readme = "README.md"
authors = [
    { name = "Pyx", email = "git@notpyx.me" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "orjson>=3.13.0",
    "python-mpv>=1.0.8",
    "rich>=15.0.0",
]

[project.scripts]
songguesser = "songguesser:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
